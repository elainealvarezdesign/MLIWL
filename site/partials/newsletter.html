<!-- ========== Newsletter (Elementor: Section/Newsletter template) ========== -->
<section id="newsletter" class="mliwl-band mliwl-bg-lilac" aria-labelledby="newsletter-title">
  <div class="mliwl-inner">
    <div class="mliwl-newsletter-row">
      <div class="mliwl-section-header">
        <h2 id="newsletter-title" class="text-heading-h2">Get new stories and lessons</h2>
        <p class="text-body-default mliwl-muted-text">Tell us who you are and we’ll only send what fits you: new episodes, parent playbooks or lesson updates. No spam.</p>
      </div>
      <div id="newsletter-area">
        <form class="mliwl-newsletter-form" id="newsletter-form" novalidate>
          <fieldset>
            <legend>I’m a…</legend>
            <div class="mliwl-chip-group" id="audience-chips">
              <button class="mliwl-chip" type="button" aria-pressed="true">Teen</button>
              <button class="mliwl-chip" type="button" aria-pressed="false">Parent or caregiver</button>
              <button class="mliwl-chip" type="button" aria-pressed="false">Educator</button>
            </div>
          </fieldset>
          <div class="mliwl-field">
            <label for="nl-email">Email address</label>
            <div class="mliwl-field-row">
              <input id="nl-email" type="email" autocomplete="email" placeholder="name@example.com" aria-describedby="nl-help">
              <button class="mliwl-btn mliwl-btn-primary" type="submit">Get updates</button>
            </div>
            <p id="nl-help" class="mliwl-field-help text-caption">We never share your email. Read our <a href="privacy.html">privacy policy</a>.</p>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
